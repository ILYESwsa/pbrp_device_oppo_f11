name: Slim recovery image (CPH1911)

on:
  push:
    branches: [aera-16.0-slim]

permissions:
  contents: write
  actions: read

concurrency:
  group: slim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slim:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Read source run id
        id: src
        shell: bash
        run: echo "id=$(tr -dc 0-9 < .github/slim/source-run-id)" >> "$GITHUB_OUTPUT"

      - name: Download built recovery.img
        uses: actions/download-artifact@v4
        with:
          name: recovery-CPH1911
          run-id: ${{ steps.src.outputs.id }}
          github-token: ${{ github.token }}
          path: in

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 zstd xz-utils cpio binutils python3 git
          mkdir -p tools
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg tools/mkbootimg
          git clone --depth 1 https://android.googlesource.com/platform/external/avb tools/avb

      - name: Slim the ramdisk
        shell: bash
        run: |
          set -o pipefail
          python3 .github/slim/slim.py in/recovery.img out 2>&1 | tee slim.log

      - name: Publish report to ci-logs
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ci-logs/slim-$GITHUB_RUN_ID.txt"
          tail -n 600 slim.log > /tmp/s.txt 2>/dev/null || echo "no slim.log" > /tmp/s.txt
          base64 -w0 /tmp/s.txt > /tmp/s.b64
          python3 - > /tmp/body.json <<'PY'
          import json
          print(json.dumps({"message":"slim report","content":open('/tmp/s.b64').read(),"branch":"ci-logs"}))
          PY
          curl -s -o /dev/null -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -d @/tmp/body.json "$API"

      - name: Upload slim image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-slim
          path: |
            out/recovery-slim.img
            out/report.txt
          if-no-files-found: error
