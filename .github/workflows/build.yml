
name: Build AERA recovery (CPH1911, v5)

on:
  push:
    branches: [aera-16.0-v5]
    # Doc-only pushes must not burn a 6-hour runner (the 2026-11-16 README push did).
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      AERA_BUILD_DEVICE: CPH1911
      LC_ALL: C

    steps:
      - name: Free disk space and add swap
        shell: bash
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/share/swift /usr/local/.ghcup /usr/local/share/powershell /usr/local/share/chromium \
            /usr/share/miniconda /opt/microsoft /opt/az /usr/lib/google-cloud-sdk /usr/lib/jvm /usr/lib/firefox \
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/local/julia* /usr/local/n /opt/google /usr/local/graalvm
          sudo docker image prune -af || true
          sudo apt-get clean
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          ROOT_FREE=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          MNT_FREE=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)
          echo "free GB after cleanup: /=${ROOT_FREE:-0} /mnt=${MNT_FREE:-0}"

          if [ "${MNT_FREE:-0}" -gt "${ROOT_FREE:-0}" ]; then
            sudo mkdir -p /mnt/aera
            sudo chown "$(id -u):$(id -g)" /mnt/aera
            rm -rf "$GITHUB_WORKSPACE/aera"
            ln -sfn /mnt/aera "$GITHUB_WORKSPACE/aera"
            BIG=/mnt
            BIGFREE=$MNT_FREE
          else
            mkdir -p "$GITHUB_WORKSPACE/aera"
            BIG=/
            BIGFREE=$ROOT_FREE
          fi

          echo "source tree on: $BIG ($BIGFREE GB free)"
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 bc rsync lz4 \
            libssl-dev cpio xz-utils zstd ccache

          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global color.ui false

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: aera/out/ccache
          key: ccache-aera16-v5-${{ github.run_id }}
          restore-keys: |
            ccache-aera16-v5-

      - name: Compute source-cache key
        id: srckey
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Restore source cache
        id: srccache
        uses: actions/cache/restore@v4
        with:
          path: aera-src-cache.tar.zst
          key: aera-src-aera16-${{ steps.srckey.outputs.month }}
          restore-keys: |
            aera-src-aera16-

      - name: Sync AERA 16.0 sources
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aera"
          cd "$GITHUB_WORKSPACE/aera"

          # Seed .repo from the bounded source cache (git object stores for the
          # biggest projects) so repo sync only has to fetch the delta.
          SRCTAR="$GITHUB_WORKSPACE/aera-src-cache.tar.zst"
          if [ -f "$SRCTAR" ]; then
            echo "source cache: $(stat -c %s "$SRCTAR") bytes, extracting..."
            mkdir -p .repo
            tar --use-compress-program='zstd -T0' -xf "$SRCTAR" -C .repo
            echo "seeded .repo: $(du -sh .repo 2>/dev/null | cut -f1)"
          else
            echo "no source cache, full sync"
          fi

          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags

          df -h /

      - name: Snapshot source cache
        id: srcsnap
        shell: bash
        run: |
          # Rebuild the bounded source cache after the sync: manifests, every
          # project's small git config dir, and the largest git object stores,
          # capped at ~6.2 GB so it fits GitHub's 10 GB cache quota next to the
          # 3 GB ccache (git packs barely compress, so the tar stays near raw size).
          # Only project dirs whose object store made it into the budget are
          # included; the rest are simply re-cloned on the next cold sync.
          TAR="$GITHUB_WORKSPACE/aera-src-cache.tar.zst"
          rm -f "$TAR"
          cd "$GITHUB_WORKSPACE/aera/.repo" || { echo "no .repo, skipping"; exit 0; }

          BUDGET=$((6 * 1024 * 1024 * 1024 + 200 * 1024 * 1024))   # 6.2 GB
          USED=$(du -sb manifests manifests.git 2>/dev/null | awk '{s+=$1} END{print s+0}' || true)
          STORES=""
          while IFS=$'\t' read -r sz p; do
            [ "$((USED + sz))" -gt "$BUDGET" ] && continue
            STORES="$STORES $(basename "$p")"
            USED=$((USED + sz))
          done < <(du -sb project-objects/* 2>/dev/null | sort -rn)
          echo "cached object stores:$(echo $STORES | wc -w), raw budget used: $((USED / 1024 / 1024)) MB"

          LIST="manifests manifests.git"
          for d in projects/*; do
            if [ -r "$d/objects/info/alternates" ]; then
              alt=$(head -1 "$d/objects/info/alternates")
              store=${alt##*project-objects/}
              store=${store%%/*}
              case " $STORES " in
                *" $store "*) LIST="$LIST $d" ;;
              esac
            fi
          done
          echo "snapshot entries: $(echo $LIST | wc -w)"

          if ! tar --use-compress-program='zstd -T0' -cf "$TAR" $LIST; then
            echo "tar failed, skipping source cache" >&2
            rm -f "$TAR"
            exit 0
          fi
          SIZE=$(stat -c %s "$TAR")
          echo "source cache tarball: $SIZE bytes"
          if [ "$SIZE" -lt $((100 * 1024 * 1024)) ]; then
            echo "snapshot too small, refusing to cache" >&2
            rm -f "$TAR"
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Save source cache
        if: steps.srccache.outputs.cache-hit != 'true' && steps.srcsnap.outputs.ok == 'true'
        uses: actions/cache/save@v4
        with:
          path: aera-src-cache.tar.zst
          key: aera-src-aera16-${{ steps.srckey.outputs.month }}

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: aera/device/oppo/CPH1911

      - name: Prepare ci-logs branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -o /dev/null -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
            -d "{\"ref\":\"refs/heads/ci-logs\",\"sha\":\"$GITHUB_SHA\"}" || true

      - name: Disk and memory diagnostics
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            df -h
            swapon --show
            free -m
            du -sh "$GITHUB_WORKSPACE/aera/.repo" 2>/dev/null
            du -sh --exclude=.repo "$GITHUB_WORKSPACE/aera" 2>/dev/null
          } > "$GITHUB_WORKSPACE/build.log" 2>&1

          bash "$GITHUB_WORKSPACE/aera/device/oppo/CPH1911/.github/ci-push-log.sh"

      - name: Add disk swap for soong_build
        shell: bash
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile

          ROOT_FREE=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          MNT_FREE=$(df --output=avail -BG /mnt 2>/dev/null | tail -1 | tr -dc 0-9)

          echo "free GB: /=$ROOT_FREE /mnt=${MNT_FREE:-0}"

          if [ "${MNT_FREE:-0}" -ge 26 ]; then
            SWF=/mnt/swapfile
            FREE=$MNT_FREE
            SZ=$(( FREE - 2 ))
          else
            SWF=/swapfile
            FREE=$ROOT_FREE
            SZ=$(( FREE - 14 ))
          fi

          [ "$SZ" -gt 28 ] && SZ=28

          if [ "$SZ" -ge 8 ]; then
            sudo fallocate -l ${SZ}G "$SWF" &&
            sudo chmod 600 "$SWF" &&
            sudo mkswap "$SWF" >/dev/null &&
            sudo swapon "$SWF"
          fi

          sudo systemctl stop docker.socket docker containerd snapd mysql postgresql apache2 nginx php8.1-fpm 2>/dev/null || true

          sync
          echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
          sudo sysctl vm.swappiness=100

          df -h
          swapon --show
          free -h

      - name: Build recovery image
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUSH="bash $GITHUB_WORKSPACE/aera/device/oppo/CPH1911/.github/ci-push-log.sh"

          trap "$PUSH" EXIT
          trap "$PUSH; exit 143" TERM

          cd "$GITHUB_WORKSPACE/aera"

          export ALLOW_MISSING_DEPENDENCIES=true

          # Store ccache inside the writable Android output directory.
          export CCACHE_DIR="$GITHUB_WORKSPACE/aera/out/ccache"
          mkdir -p "$CCACHE_DIR"

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_MAXSIZE=3G
          export CCACHE_COMPRESS=1
          export CCACHE_NOHASHDIR=1
          export CCACHE_COMPILERCHECK=content
          export CCACHE_SLOPPINESS=include_file_mtime,include_file_ctime,time_macros
          export CCACHE_BASEDIR="$(readlink -f "$GITHUB_WORKSPACE/aera")"

          ccache -M 3G
          ccache -z

          # Keep soong_build's Go heap small.
          export GOGC=40
          export GOMEMLIMIT=11GiB
          export GOMAXPROCS=2

          source build/envsetup.sh
          lunch twrp_CPH1911-bp2a-eng

          # Push build log every 2 minutes.
          (
            while true; do
              sleep 120
              $PUSH
            done
          ) &

          mka adbd recoveryimage -j2 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: ccache stats
        if: always()
        shell: bash
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/aera/out/ccache"
          ccache -s 2>&1 | tail -12 || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: aera/out/ccache
          key: ccache-aera16-v5-${{ github.run_id }}

      - name: Header and ramdisk audit
        if: always() && steps.build.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash "$GITHUB_WORKSPACE/aera/device/oppo/CPH1911/.github/ci-audit.sh"

      - name: Permissive variant
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/aera/device/oppo/CPH1911/.github/ci-variants.sh"

      - name: Upload permissive image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-permissive
          path: variants/recovery_permissive.img
          if-no-files-found: error

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-CPH1911
          path: aera/out/target/product/CPH1911/recovery.img
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            aera/out/error.log
          if-no-files-found: warn
