name: Build AERA recovery (CPH1911)

on:
  push:
    branches: [aera-16.0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      AERA_BUILD_DEVICE: CPH1911
      LC_ALL: C
    steps:
      - name: Free disk space and add swap
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune -af || true
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          df -h /
          free -h

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 lib32z1-dev x11proto-core-dev libx11-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 bc rsync lz4 \
            libssl-dev cpio xz-utils
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "ci"
          git config --global user.email "ci@users.noreply.github.com"
          git config --global color.ui false

      - name: Sync AERA 16.0 sources
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/aera"
          cd "$GITHUB_WORKSPACE/aera"
          repo init -u https://github.com/AERA-Recovery/android_manifest.git -b aera-16.0 --depth=1
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags
          df -h /

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: aera/device/oppo/CPH1911

      - name: Prepare ci-logs branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -s -o /dev/null -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/refs" \
            -d "{\"ref\":\"refs/heads/ci-logs\",\"sha\":\"$GITHUB_SHA\"}" || true

      - name: Build recovery image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PUSH="bash $GITHUB_WORKSPACE/aera/device/oppo/CPH1911/.github/ci-push-log.sh"
          trap "$PUSH" EXIT
          trap "$PUSH; exit 143" TERM
          cd "$GITHUB_WORKSPACE/aera"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch twrp_CPH1911-bp2a-eng
          # Snapshot memory + build log to the ci-logs branch every 2 minutes
          ( while true; do sleep 120; $PUSH; done ) &
          mka adbd recoveryimage -j2 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Upload recovery image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-CPH1911
          path: aera/out/target/product/CPH1911/recovery.img
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            aera/out/error.log
          if-no-files-found: warn
